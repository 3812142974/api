name: Publish links.json Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name'
        required: true
        default: 'v0.0.1'
      title:
        description: 'Release title'
        required: true
        default: 'v0.0.1'
      body:
        description: 'Release notes'
        required: false
        default: 'Release 0.0.1'
      draft:
        description: 'Create as draft?'
        required: false
        default: 'false'
      prerelease:
        description: 'Create as prerelease?'
        required: false
        default: 'false'
      target:
        description: 'Target branch or commitish'
        required: true
        default: 'main'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      releases: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify links.json exists
        run: |
          if [ ! -f links.json ]; then
            echo "links.json not found in repository root (expected path: /links.json)." >&2
            ls -la
            exit 1
          fi

      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tag }}
          release_name: ${{ github.event.inputs.title }}
          body: ${{ github.event.inputs.body }}
          draft: ${{ github.event.inputs.draft }}
          prerelease: ${{ github.event.inputs.prerelease }}
          target_commitish: ${{ github.event.inputs.target }}

      - name: Upload links.json asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./links.json
          asset_name: links.json
          asset_content_type: application/json
